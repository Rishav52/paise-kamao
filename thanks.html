<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>धन्यवाद — हमें आपका संदेश मिल गया</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&family=Poppins:wght@700&display=swap" rel="stylesheet">
<style>
body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:#fff;
  font:400 15px/1.6 'DM Sans',system-ui,sans-serif;color:#131a24;padding:24px}
.box{max-width:420px;text-align:center}
.tick{width:64px;height:64px;margin:0 auto 18px;border-radius:50%;background:#e7f7ee;color:#0e9d69;
  display:flex;align-items:center;justify-content:center;font-size:30px}
h1{font:700 24px 'Poppins',sans-serif;letter-spacing:-.02em;margin:0}
p{color:#6b7280;margin:10px 0 0;font-size:14px}
a{display:inline-block;margin-top:22px;background:#07603f;color:#fff;text-decoration:none;border-radius:24px;
  padding:12px 24px;font:700 14px 'Poppins',sans-serif}
</style>
</head>
<body>
  <div class="box">
    <div class="tick">✓</div>
    <h1>धन्यवाद!</h1>
    <p>आपका संदेश मिल गया है। हम जल्द ही आपके नंबर पर संपर्क करेंगे।</p>
    <a href="/">वापस होम पेज पर</a>
  </div>
</body>
</html>
